<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A dark mode that remembers you · Miguel Clavel</title>
<meta name="description" content="A light and dark toggle that remembers the visitor's choice and starts from their system setting, with no flash on load. One file. By Miguel Clavel.">
<meta property="og:title" content="A dark mode that remembers you · Miguel Clavel">
<meta property="og:description" content="A light and dark toggle that remembers the visitor's choice and starts from their system setting, with no flash on load. One file. By Miguel Clavel.">
<meta property="og:image" content="https://miguelclavel.github.io/dark-mode/assets/social.jpg">
<meta property="og:url" content="https://miguelclavel.github.io/dark-mode/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://miguelclavel.github.io/dark-mode/">
<script>
  // Runs before the page paints, so the right theme is there from the first
  // frame: the saved choice if there is one, otherwise the system setting.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : system;
  })();
</script>
<style>
  :root { --page: #F9F9FB; --panel: #FFFFFF; --ink: #1D1D21; --muted: #67676C; --rule: #DADADD; --link: #1F5FD1; }
  :root[data-theme="dark"] { --page: #0F0F11; --panel: #18181B; --ink: #F5F5F7; --muted: #A3A3A8; --rule: #2E2E33; --link: #7AAEFF; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--page); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; transition: background-color .25s ease, color .25s ease; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 18px clamp(20px, 4vw, 48px); }
  header b { font-size: 17px; letter-spacing: -0.02em; }
  .toggle { width: 40px; height: 40px; display: inline-grid; place-items: center; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); color: var(--ink); cursor: pointer; }
  .toggle:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .toggle svg { width: 18px; height: 18px; }
  :root[data-theme="dark"] .moon, :root:not([data-theme="dark"]) .sun { display: none; }
  main { width: min(680px, 100% - 40px); margin: 12vh auto 0; }
  h1 { margin: 0; font-size: clamp(36px, 7vw, 64px); line-height: 1.05; letter-spacing: -0.04em; }
  p { font-size: 18px; line-height: 1.6; color: var(--muted); }
  .card { margin-top: 28px; padding: 18px 20px; border: 1px solid var(--rule); border-radius: 14px; background: var(--panel); font-size: 15px; color: var(--muted); }
  .card button { font: inherit; color: var(--link); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { body { transition: none; } }
  body.embed header b, body.embed .card { display: none; }
</style>
<!-- Visit counter for miguelclavel.github.io: which demos are opened and which links are used. No cookies, no IP addresses, nothing typed. Delete this line if you copy the page. -->
<script src="https://miguelclavel.github.io/track.js" data-site="github-pages" data-endpoint="https://github-pages-log.miguelclavel-1.workers.dev/api/log" defer></script>
</head>
<body>
<header>
  <b>Miguel Clavel</b>
  <button class="toggle" type="button" id="toggle" aria-label="Switch to dark mode">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<main>
  <h1>Come back tomorrow. It'll still be how you left it.</h1>
  <p>Pick light or dark with the button in the corner, then refresh, or close the tab and come back. Your choice sticks. If you've never picked, the page follows your system setting.</p>
  <div class="card" id="state"></div>
</main>
<script>
  if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');
  const root = document.documentElement, btn = document.getElementById('toggle'), state = document.getElementById('state');
  const saved = () => { try { return localStorage.getItem('theme'); } catch (e) { return null; } };
  function render() {
    const t = root.dataset.theme;
    btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    btn.setAttribute('aria-pressed', String(t === 'dark'));
    const s = saved();
    state.innerHTML = s ? `You chose <b>${s}</b>. It's saved for your next visit. <button type="button" id="forget">Forget my choice</button>`
                        : `You haven't picked yet, so this follows your system: <b>${t}</b>.`;
    const forget = document.getElementById('forget');
    if (forget) forget.onclick = () => { try { localStorage.removeItem('theme'); } catch (e) {} root.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; render(); };
  }
  btn.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    render();
  });
  // Until someone picks, keep following the system if it changes (sunset mode, for example).
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => { if (!saved()) { root.dataset.theme = e.matches ? 'dark' : 'light'; render(); } });
  render();
</script>
</body>
</html>
